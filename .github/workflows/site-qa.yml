name: Site build and SEO QA

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CSS build dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Python build scripts
        run: python3 -m py_compile tools/*.py
      - name: Apply shared page partials
        run: python3 tools/apply_partials.py
      - name: Build all generated pages, CSS, images and sitemap
        run: python3 tools/build_all.py
      - name: Run link, JSON-LD, sitemap and reachability QA
        run: python3 tools/qa_site.py
